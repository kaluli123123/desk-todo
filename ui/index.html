<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>待办</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="drag-strip" data-tauri-drag-region></div>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="search" type="search" placeholder="搜索" autocomplete="off" spellcheck="false" />
      </label>
      <nav id="smart-nav" class="nav"></nav>
      <div class="divider"></div>
      <nav id="list-nav" class="nav lists"></nav>
      <button id="new-list" class="new-list">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>新建列表</span>
      </button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <header class="header" data-tauri-drag-region>
        <button id="toggle-sidebar" class="icon-btn ghost" title="显示/隐藏侧边栏">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <h1 id="title"></h1>
        <div class="header-actions">
          <button id="pin" class="icon-btn" title="置顶（覆盖在所有窗口之上）">
            <svg viewBox="0 0 24 24"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5M9 16l-4-4 1.5-1.5L11 11l4-4 1-3"/></svg>
          </button>
          <button id="more" class="icon-btn" title="更多">
            <svg viewBox="0 0 24 24" class="fill"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
      </header>
      <div id="subtitle" class="subtitle"></div>

      <section class="tasks" id="tasks"></section>

      <form id="add-form" class="add">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <input id="add-input" placeholder="添加任务" autocomplete="off" spellcheck="false" />
      </form>
    </main>
  </div>

  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel">取消</button>
        <button id="modal-ok" class="danger">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
